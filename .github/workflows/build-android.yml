name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci || npm install

      - name: Change package name and app name
        run: |
          sed -i 's/applicationId "[^"]*"/applicationId "com.meng.music"/' android/app/build.gradle
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">moomusic</string>|' android/app/src/main/res/values/strings.xml
          grep -n "applicationId" android/app/build.gradle
          grep -n "app_name" android/app/src/main/res/values/strings.xml

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS="$PWD/android/app/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            keytool -genkeypair -keystore "$KS" -alias temp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass temp123456 -keypass temp123456 \
              -dname "CN=Temp, O=Temp, C=CN"
            PASS=temp123456; ALIAS=temp
          fi
          printf "storeFile=%s\nkeyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n" \
            "$KS" "$ALIAS" "$PASS" "$PASS" > android/keystore.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
