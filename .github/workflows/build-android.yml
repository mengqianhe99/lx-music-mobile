name: Build Android APK

on:
  workflow_dispatch:        # 在 Actions 页面手动点击运行
  push:
    tags:
      - 'v*'                # 推送 v1.0.0 这样的 tag 时自动打包并发布 Release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build release APK (unsigned)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KS_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          else
            echo "未配置签名密钥，使用临时密钥签名（仅供测试，不能覆盖安装正式版）"
            keytool -genkeypair -v -keystore release.keystore \
              -alias temp -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass temp123456 -keypass temp123456 \
              -dname "CN=Temp, O=Temp, C=CN"
            echo "KS_PASS=temp123456" >> $GITHUB_ENV
            echo "KS_ALIAS=temp" >> $GITHUB_ENV
          fi

      - name: Align and sign APKs
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          mkdir -p dist
          find android/app/build/outputs/apk/release -name "*.apk" | while read apk; do
            name=$(basename "$apk" .apk)
            name=${name%-unsigned}
            "$BT/zipalign" -f -p 4 "$apk" "dist/$name-aligned.apk"
            "$BT/apksigner" sign \
              --ks release.keystore \
              --ks-pass pass:$KS_PASS \
              --ks-key-alias $KS_ALIAS \
              --key-pass pass:$KS_PASS \
              --out "dist/$name-signed.apk" "dist/$name-aligned.apk"
            rm "dist/$name-aligned.apk"
          done
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
